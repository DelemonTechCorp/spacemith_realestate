<!-- ============================================================================
     ENQUIRY POPUP MODAL (UPDATED WITH AGGRESSIVE TIMING)
     12 sec → 25 sec → 15 sec
     ============================================================================ -->

<!-- MODAL OVERLAY + FORM CONTAINER -->
<div id="enquiryModal" class="enquiry-modal" role="dialog" aria-labelledby="enquiryModalTitle" aria-hidden="true">
  <div class="enquiry-modal__overlay" id="enquiryOverlay" aria-label="Close"></div>
  
  <div class="enquiry-modal__content">
    <!-- Close button (X) -->
    <button class="enquiry-modal__close" id="enquiryClose" type="button" aria-label="Close enquiry form">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Form Header -->
    <div class="enquiry-modal__header">
      <h2 id="enquiryModalTitle" class="enquiry-modal__title">Let's Find Your Space</h2>
      <p class="enquiry-modal__subtitle">Quick enquiry — we'll be in touch within one business day</p>
    </div>

    <!-- Form -->
    <form id="enquiryForm" class="enquiry-form" method="POST" action="{% url 'quick_enquiry' %}">
      {% csrf_token %}

      <!-- Name -->
      <div class="field">
        <label for="enquiryName">Your Name *</label>
        <input 
          id="enquiryName"
          type="text" 
          name="name" 
          placeholder="Full name"
          required
          autocomplete="name"
        />
      </div>

      <!-- Email -->
      <div class="field">
        <label for="enquiryEmail">Email Address *</label>
        <input 
          id="enquiryEmail"
          type="email" 
          name="email" 
          placeholder="your@email.com"
          required
          autocomplete="email"
        />
      </div>

      <!-- Phone -->
      <div class="field">
        <label for="enquiryPhone">Phone Number *</label>
        <input 
          id="enquiryPhone"
          type="tel" 
          name="phone" 
          placeholder="+971 50 123 4567"
          required
          autocomplete="tel"
        />
      </div>

      <!-- Honeypot (hidden from users) -->
      <div class="field field--honeypot" style="display: none;">
        <label for="enquiryWebsite">Website</label>
        <input id="enquiryWebsite" type="text" name="website" />
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-gold enquiry-form__submit" id="enquirySubmit">
        Send Enquiry
      </button>

      <p class="enquiry-form__privacy">
        By submitting, you agree to our <a href="{% url 'privacy-policy' %}" target="_blank">privacy policy</a>.
      </p>
    </form>
  </div>
</div>

<!-- FLOATING TRIGGER ICON (left-bottom corner) -->
<button 
  id="enquiryTrigger" 
  class="enquiry-trigger" 
  type="button"
  aria-label="Open quick enquiry form"
  title="Quick Enquiry">
  <svg viewBox="0 0 24 24" aria-hidden="true" class="enquiry-trigger__icon">
    <!-- Message/chat icon -->
    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="currentColor"/>
  </svg>
</button>

<!-- ============================================================================
     STYLES (add to base.html <style> section or keep inline here)
     ============================================================================ -->
<style>
  /* ─────────────────────────────────────────────────────────────────────── */
  /* ENQUIRY MODAL POPUP                                                     */
  /* ─────────────────────────────────────────────────────────────────────── */

  .enquiry-modal {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .enquiry-modal[aria-hidden="true"] {
    visibility: hidden;
  }

  .enquiry-modal[aria-hidden="false"] {
    visibility: visible;
  }

  .enquiry-modal__overlay {
    position: absolute;
    inset: 0;
    background: rgba(11, 21, 18, 0.5);
    backdrop-filter: blur(4px);
    pointer-events: auto;
    animation: fadeIn 0.3s ease;
  }

  .enquiry-modal__content {
    position: relative;
    width: 90%;
    max-width: 420px;
    background: var(--card);
    border-radius: .5rem;
    box-shadow: 0 24px 60px rgba(11, 21, 18, 0.25);
    padding: 2rem 1.5rem;
    pointer-events: auto;
    animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @media (max-width: 480px) {
    .enquiry-modal__content {
      width: 95%;
      max-width: none;
      padding: 1.5rem 1.25rem;
      border-radius: 0.5rem;
    }
  }

  .enquiry-modal__close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--muted-foreground);
    cursor: pointer;
    padding: 0;
    transition: color 0.2s ease, transform 0.2s ease;
  }

  .enquiry-modal__close:hover {
    color: var(--primary);
    transform: scale(1.1);
  }

  .enquiry-modal__close svg {
    width: 1.25rem;
    height: 1.25rem;
  }

  .enquiry-modal__header {
    margin-bottom: 1.5rem;
    text-align: center;
  }

  .enquiry-modal__title {
    margin: 0 0 0.5rem;
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: var(--foreground);
  }

  .enquiry-modal__subtitle {
    margin: 0;
    font-size: 0.875rem;
    color: var(--muted-foreground);
  }

  /* ─────────────────────────────────────────────────────────────────────── */
  /* ENQUIRY FORM                                                            */
  /* ─────────────────────────────────────────────────────────────────────── */

  .enquiry-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .enquiry-form .field {
    gap: 0.375rem;
  }

  .enquiry-form .field label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--muted-foreground);
  }

  .enquiry-form .field input {
    width: 100%;
    height: 2.5rem;
    border-radius: 0.5rem;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    padding-inline: 0.875rem;
    font-family: inherit;
    font-size: 0.875rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .enquiry-form .field input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(10, 42, 32, 0.1);
  }

  .enquiry-form .field input::placeholder {
    color: rgba(11, 21, 18, 0.45);
  }

  .enquiry-form__submit {
    margin-top: 0.5rem;
    height: 2.75rem;
    font-size: 0.9375rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    transition: filter 0.2s ease, transform 0.2s ease;
  }

  .enquiry-form__submit:hover {
    filter: brightness(0.95);
    transform: translateY(-2px);
  }

  .enquiry-form__submit:active {
    transform: translateY(0);
  }

  .enquiry-form__privacy {
    margin: 0.75rem 0 0;
    font-size: 0.75rem;
    color: var(--muted-foreground);
    text-align: center;
  }

  .enquiry-form__privacy a {
    color: var(--primary);
    text-decoration: underline;
  }

  .enquiry-form__privacy a:hover {
    color: var(--primary-dark);
  }

  /* Honeypot field (always hidden) */
  .field--honeypot {
    display: none !important;
  }

  /* ─────────────────────────────────────────────────────────────────────── */
  /* FLOATING TRIGGER BUTTON (left-bottom)                                   */
  /* ─────────────────────────────────────────────────────────────────────── */

  .enquiry-trigger {
    position: fixed;
    left: 1.5rem;
    bottom: 1.5rem;
    z-index: 1999;
    width: 3.5rem;
    height: 3.5rem;
    border-radius: 50%;
    background: var(--primary);
    color: var(--cream);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(11, 21, 18, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    animation: floatIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    animation-delay: 0.3s;
  }

  .enquiry-trigger:hover {
    transform: scale(1.08);
    background: var(--primary-dark);
    box-shadow: 0 12px 32px rgba(11, 21, 18, 0.32);
  }

  .enquiry-trigger:active {
    transform: scale(0.96);
  }

  .enquiry-trigger__icon {
    width: 1.5rem;
    height: 1.5rem;
  }

  @media (max-width: 480px) {
    .enquiry-trigger {
      width: 3.125rem;
      height: 3.125rem;
      left: 1rem;
      bottom: 1rem;
    }

    .enquiry-trigger__icon {
      width: 1.375rem;
      height: 1.375rem;
    }
  }

  /* ─────────────────────────────────────────────────────────────────────── */
  /* ANIMATIONS                                                              */
  /* ─────────────────────────────────────────────────────────────────────── */

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(32px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes floatIn {
    from {
      opacity: 0;
      transform: scale(0);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* Respect prefers-reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    .enquiry-modal__overlay,
    .enquiry-modal__content,
    .enquiry-trigger {
      animation: none;
    }

    .enquiry-modal__overlay {
      opacity: 1;
    }

    .enquiry-modal__content {
      opacity: 1;
      transform: none;
    }

    .enquiry-trigger {
      opacity: 1;
      transform: none;
    }
  }
</style>

<!-- ============================================================================
     POPUP CONTROLLER SCRIPT (UPDATED WITH AGGRESSIVE TIMING)
     12 sec → 25 sec → 15 sec
     ============================================================================ -->
<script>
  (function () {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var modal = document.getElementById('enquiryModal');
    var trigger = document.getElementById('enquiryTrigger');
    var closeBtn = document.getElementById('enquiryClose');
    var overlay = document.getElementById('enquiryOverlay');
    var form = document.getElementById('enquiryForm');
    var submitBtn = document.getElementById('enquirySubmit');

    if (!modal || !trigger) return;

    // ── LOCAL STORAGE KEYS ──
    var STORAGE_KEY_SUBMITTED = 'enquiryFormSubmitted';
    var STORAGE_KEY_LAST_DISMISS = 'enquiryModalLastDismiss';
    var STORAGE_KEY_DISMISS_COUNT = 'enquiryModalDismissCount';
    var DISMISS_COOLDOWN_MS_1 = 25 * 1000;  // 25 seconds after 1st dismiss
    var DISMISS_COOLDOWN_MS_2 = 35 * 1000;  // 35 seconds after 2nd+ dismiss
    var AUTO_SHOW_DELAY_MS = 6 * 1000;     // 6 seconds on first load

    // ── HELPER: Check if form was ever submitted ──
    function hasFormBeenSubmitted() {
      return localStorage.getItem(STORAGE_KEY_SUBMITTED) === 'true';
    }

    // ── HELPER: Check if enough time has passed since last dismiss ──
    function canShowAgain() {
      var lastDismiss = localStorage.getItem(STORAGE_KEY_LAST_DISMISS);
      if (!lastDismiss) return true;
      var elapsed = Date.now() - parseInt(lastDismiss, 10);
      var dismissCount = parseInt(localStorage.getItem(STORAGE_KEY_DISMISS_COUNT) || '0', 10);
      var cooldown = dismissCount === 1 ? DISMISS_COOLDOWN_MS_1 : DISMISS_COOLDOWN_MS_2;
      return elapsed >= cooldown;
    }

    // ── OPEN MODAL ──
    function openModal() {
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      if (!reduced) {
        document.getElementById('enquiryName').focus();
      }
    }

    // ── CLOSE MODAL ──
    function closeModal() {
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    // ── DISMISS & SCHEDULE RE-SHOW ──
    function dismissModal() {
      closeModal();
      
      // Count how many times dismissed
      var dismissCount = parseInt(localStorage.getItem(STORAGE_KEY_DISMISS_COUNT) || '0', 10);
      dismissCount++;
      localStorage.setItem(STORAGE_KEY_DISMISS_COUNT, dismissCount.toString());
      
      // Set different cooldown based on dismiss count
      var cooldown = dismissCount === 1 ? DISMISS_COOLDOWN_MS_1 : DISMISS_COOLDOWN_MS_2;
      
      localStorage.setItem(STORAGE_KEY_LAST_DISMISS, Date.now().toString());
      
      // Re-show after cooldown (if not submitted yet)
      setTimeout(function () {
        if (!hasFormBeenSubmitted() && canShowAgain()) {
          openModal();
        }
      }, cooldown);
    }

    // ── FORM SUBMISSION ──
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      
      // Mark as submitted
      localStorage.setItem(STORAGE_KEY_SUBMITTED, 'true');
      
      // Disable submit button
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      // Create FormData and send via fetch
      var formData = new FormData(form);
      
      fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {
          'X-Requested-With': 'XMLHttpRequest'
        }
      })
      .then(function (response) {
        return response.json();
      })
      .then(function (data) {
        if (data.status === 'success') {
          // Show success message
          submitBtn.textContent = '✓ Enquiry Sent!';
          setTimeout(function () {
            closeModal();
            // Reset form
            form.reset();
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Enquiry';
          }, 1500);
        } else {
          // Server error
          alert('Error: ' + (data.message || 'Please try again.'));
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Enquiry';
        }
      })
      .catch(function (err) {
        console.error('Form submission error:', err);
        alert('Network error. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Enquiry';
      });
    });

    // ── EVENT LISTENERS ──
    closeBtn.addEventListener('click', dismissModal);
    overlay.addEventListener('click', dismissModal);
    trigger.addEventListener('click', openModal);

    // Close on ESC key
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.getAttribute('aria-hidden') === 'false') {
        dismissModal();
      }
    });

    // ── AUTO-SHOW LOGIC ──
    if (!hasFormBeenSubmitted()) {
      setTimeout(function () {
        // Only show if user hasn't dismissed recently
        if (canShowAgain()) {
          openModal();
        }
      }, AUTO_SHOW_DELAY_MS);
    }

    // Initially hidden
    modal.setAttribute('aria-hidden', 'true');
  })();
</script>
