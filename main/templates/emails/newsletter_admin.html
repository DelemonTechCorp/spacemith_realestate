<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f3f1ec;font-family:Arial,Helvetica,sans-serif;color:#0b1512;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f1ec;padding:28px 14px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #e5e2da;">

        <!-- header -->
        <tr><td style="background:#0a2a20;padding:30px 36px;">
          <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#d4af37;font-weight:bold;">Spacesmith Real Estate</div>
          <div style="font-size:22px;color:#f6f2e9;margin-top:8px;font-weight:bold;">New Newsletter Subscriber</div>
        </td></tr>
        <tr><td style="height:3px;background:#d4af37;line-height:0;font-size:0;">&nbsp;</td></tr>

        <!-- body -->
        <tr><td style="padding:32px 36px;">
          <p style="margin:0 0 22px;font-size:14px;color:#444;line-height:1.6;">
            A new visitor has subscribed to the Spacesmith Real Estate newsletter.
          </p>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;color:#0b1512;">
            <tr><td style="padding:10px 0;border-bottom:1px solid #eee;width:130px;color:#777;">Email</td><td style="padding:10px 0;border-bottom:1px solid #eee;font-weight:bold;"><a href="mailto:{{ subscriber_email }}" style="color:#0a2a20;">{{ subscriber_email }}</a></td></tr>
            <tr><td style="padding:10px 0;color:#777;">Subscribed</td><td style="padding:10px 0;">{{ subscribed_at }}</td></tr>
          </table>
        </td></tr>

        <!-- footer -->
        <tr><td style="background:#f7f5ef;padding:20px 36px;font-size:11px;color:#999;line-height:1.6;">
          This is an automated notification from spacesmithrealestate.com
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
